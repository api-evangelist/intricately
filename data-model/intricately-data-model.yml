  via: industry
- from: Company
  to: Employees
  type: has_one
  via: employees
- from: Company
  to: TrafficDistribution
  type: has_one
  via: traffic_distribution
- from: Company
  to: UseCase
  type: has_many
  via: use_cases
- from: Company
  to: Rollups
  type: has_one
  via: rollups
- from: Company
  to: Service
  type: has_many
  via: services
- from: Service
  to: Vendor
  type: has_many
  via: vendors
- from: Company
  to: Report
  type: has_one
  via: report
- from: Company
  to: History
  type: has_one
  via: history
- from: BulkJob
  to: Company
  type: has_many
  via: results
  note: >-
    GET /api/v2/bulk_jobs/{job_id}/results returns a paged array of Company
    documents plus a `total` count; page with `size` (default 10, max 100) and
    `from` (offset, default 0).
data_editions:
  note: >-
    Field availability is contractual, not universal. The docs mark these field
    groups as belonging to a named Data Edition; a caller on a different edition
    will not receive them.
  editions:
  - name: Digital Relationship
    gates:
    - parent
    - parent_root
    - children
  - name: Geographic Intelligence
    gates:
    - traffic_distribution
  - name: Go-To-Market (Use Case)
    gates:
    - use_cases
  - name: Detailed Spend
    gates:
    - services[].spend
    - services[].vendors[].spend
  - name: Historical
    gates:
    - history
    - services[].vendors[].started_at
  - name: Advanced Account Scoring
    gates:
    - application.workload_score
    - services[].vendors[].self_hosted
