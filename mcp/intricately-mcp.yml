tools:
- name: create_bulk_job
  description: >-
    Submit an array of domains to be enriched with cloud adoption, usage and spend
    data. Returns a job_id to poll. Up to 10 domains per job during the evaluation
    period, up to 10,000 with an Enterprise license.
  source_operation: POST /api/v2/bulk_jobs
  parameters:
    body: array of domain strings
  docs: https://kb.intricately.com/docs/create-a-bulk-job
  route_probe: 403 (auth required — route exists)
- name: list_bulk_jobs
  description: List your Bulk Jobs with status, job_id and created_at.
  source_operation: GET /api/v2/bulk_jobs
  parameters: {}
  response_fields:
  - results
  - total
  - page
  - result_count
  docs: https://help.intricately.com/articles/8747664834-list-bulk-jobs
  route_probe: 403 (auth required — route exists)
- name: get_bulk_job_status
  description: >-
    Get the status of a Bulk Job by job_id. Returns {status, job_id, created_at};
    poll until status is completed.
  source_operation: GET /api/v2/bulk_jobs/{job_id}
  parameters:
    job_id: ID of the Bulk Job (path)
  docs: https://help.intricately.com/articles/2511508170-get-bulk-job-status
  route_probe: 403 (auth required — route exists)
- name: get_bulk_job_results
  description: >-
    Retrieve the enriched Company documents for a completed Bulk Job, paged with
    size and from.
  source_operation: GET /api/v2/bulk_jobs/{job_id}/results
  parameters:
    job_id: ID of the Bulk Job (path)
    size: results per page, default 10, maximum 100 (query, optional)
    from: page start offset, default 0 (query, optional)
  response_fields:
  - total
  - results
  docs: https://help.intricately.com/articles/7608306858-get-bulk-job-results
  route_probe: 403 (auth required — route exists)
- name: get_company
  description: Retrieve a full Company document by its Cloud Dynamics company slug.
  source_operation: GET /api/v2/companies/{company_slug}
  parameters:
    company_slug: the unique key for a company document (path)
  docs: https://kb.intricately.com/docs/get-company
  schema_ref: data-model/intricately-data-model.yml
  route_probe: 403 (auth required — route exists)
- name: lookup_company_by_domain
  description: >-
    Look up a company by domain. Domains never seen before are analyzed on demand
    and can take up to 15 minutes to produce a company document.
  source_operation: GET /api/v2/companies?domain={domain}
  parameters:
    domain: a valid domain name (query)
  docs: https://kb.intricately.com/docs/new-domains
  route_probe: 403 (auth required — route exists)
