note: >-
  No official hosted, remote or local MCP server exists for Intricately / Cloud
  Dynamics — no npm package, no PyPI package, no registry listing, no vendor
  documentation. The tools below are CANDIDATES derived from the six REST
  operations the provider documents. There is no OpenAPI to inherit input schemas
  from (none is published anywhere), so each tool records its documented parameters
  and the doc page they came from. Every route was verified live: real routes
  answer 403 with application error 4000 ("Your API key is missing or invalid"),
  while invented routes such as /api/v2/products answer an HTML 404 — so the route
  list is probed, not guessed. No endpoint URL is invented in the deployment block.
