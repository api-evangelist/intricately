note: >-
  Intricately / Cloud Dynamics publishes NO priced plan tiers for its API. This is
  an honest zero recorded after reading the provider's own surfaces, not an
  omission. The provider's "Request an API Key" article states only that "API
  access is available as part of our Enterprise plans. Interested in Enterprise?
  Contact us to learn more!" — there is no rate card, no per-credit price, and no
  self-serve checkout. The parent brand's pricing page (hginsights.com/pricing,
  where intricately.com now redirects) is likewise a contact-sales form: it says
  pricing is "based on data consumption", that platform modules include "a
  pre-set number of seats and intelligence credits, which can be expanded", and
  names contract terms (standard 2-year term; 1-year available at a higher price;
  quarterly billing at a premium) but no prices. Third-party resellers and review
  sites publish estimated ranges; those are NOT provider-published and are
  deliberately not recorded here.
