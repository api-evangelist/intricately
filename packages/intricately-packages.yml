note: >-
  No first-party client library exists for the Cloud Dynamics (Intricately) API on
  any public registry. This is a verified zero, not an unchecked field. The
  documentation ships hand-rolled cURL / Python `requests` / Ruby `RestClient`
  snippets on every endpoint page rather than an SDK, and there is no
  installable package to version. The github.com/intricately account exists but
  publishes zero public repositories; the acquirer's org, github.com/HGInsights,
  publishes eight public repositories, all internal Elixir/Snowflake tooling
  (avalanche, snowpack, ecto_ch, gimme-snowflake-creds, homebrew-tap) — none of
  which wraps this API, and none of which has been pushed to since August 2024.
  Because there is no official SDK, apis.yml carries NO `SDKs` pointer.
