- name: X-API-KEY
  type: apiKey
  in: header
  parameter_name: X-API-KEY
  description: >-
    Every API request must be authenticated using the X-API-KEY HTTP header. A missing
    or invalid key returns response code 4000. API keys are issued to Enterprise-plan
    customers on request; there is no self-serve OAuth or token flow.
