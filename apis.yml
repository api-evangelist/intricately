apis:
- name: Cloud Dynamics API (Intricately)
  description: >-
    The Cloud Dynamics API (formerly the Intricately API) provides access to cloud
    adoption, usage, and spend data on companies, products, applications, and domains.
    Requests authenticate with an X-API-KEY header and are rate limited to one request
    per second. The core workflow is the asynchronous Bulk Job: POST an array of domains
    to /api/v2/bulk_jobs to receive a job_id, poll job status, then fetch enriched
    company documents when the job completes.
  humanURL: https://kb.intricately.com/
