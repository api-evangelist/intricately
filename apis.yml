name: Intricately
description: >-
  Intricately is a cloud and technology spend intelligence platform that tracks the
  adoption, usage, and spend of more than 15,000 cloud products across millions of
  companies worldwide, giving sales and marketing teams the signals they need to find
  accounts, spot active sales cycles, and predict churn. Founded in 2014 in San
  Francisco and backed by Bloomberg Beta, GitHub, Susa Ventures, and Singtel Innov8,
  Intricately was acquired by HG Insights in March 2022 and its data product is now
  delivered as the Cloud Dynamics API. The REST API (https://api.intricately.com/api/v2)
  authenticates with an X-API-KEY header and centers on asynchronous Bulk Jobs that
  enrich lists of domains with cloud adoption, product signatures, revenue, and
  digital-relationship data. API access is available on Enterprise plans.
