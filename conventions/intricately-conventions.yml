async_jobs:
  style: bulk-job
  description: >-
    Data is requested in bulk via asynchronous Bulk Jobs. POST an array of domains
    to /api/v2/bulk_jobs to receive a job_id and status "submitted", poll GET
    /api/v2/bulk_jobs/{job_id} until status is completed, then fetch paged results
    from GET /api/v2/bulk_jobs/{job_id}/results. Large jobs can take up to 3 hours
    when many domains are new to the platform; an individual unseen domain can take
    up to 15 minutes to produce a company document.
  submit: POST /api/v2/bulk_jobs
  poll: GET /api/v2/bulk_jobs/{job_id}
  list: GET /api/v2/bulk_jobs
  collect: GET /api/v2/bulk_jobs/{job_id}/results
  completion_signal: polling only — no webhook, callback or Location header is documented
  job_states:
  - submitted
  - processing
  - ready
  - completed
  docs: https://kb.intricately.com/docs/create-a-bulk-job
idempotency:
  supported: false
  notes: >-
    No Idempotency-Key header and no idempotency contract appears anywhere in the
    documentation. The single write operation, POST /api/v2/bulk_jobs, mints a new
    job_id on every call, so a retried submission is billed and processed again.
    Because idempotency is genuinely absent, apis.yml deliberately carries NO
    `Idempotency` pointer.
pagination:
  style: offset-limit
  params:
  - name: size
    in: query
    default: 10
    maximum: 100
    description: Number of results per page.
  - name: from
    in: query
    default: 0
    description: Page start offset.
  response_fields:
  - total
  - results
  applies_to: GET /api/v2/bulk_jobs/{job_id}/results
  list_envelope_fields:
  - results
  - total
  - page
  - result_count
  notes: >-
    Corrects the earlier round, which recorded a page-number style. The documented
    mechanism on the results endpoint is offset/limit via `size` and `from`, with a
    `total` count in the envelope. The Bulk Job LIST response separately carries
    total / page / result_count.
  docs: https://help.intricately.com/articles/7608306858-get-bulk-job-results
field_expansion:
  supported: false
  notes: >-
    There is no sparse-fieldset or expand parameter. Field availability is
    contractual instead: named Data Editions (Digital Relationship, Geographic
    Intelligence, Go-To-Market, Detailed Spend, Historical, Advanced Account
    Scoring) gate whole field groups on the Company document. See
    data-model/intricately-data-model.yml.
