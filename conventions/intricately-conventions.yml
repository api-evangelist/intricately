async_jobs:
  style: bulk-job
  description: >-
    Data is requested in bulk via asynchronous Bulk Jobs. POST an array of domains to
    /api/v2/bulk_jobs to receive a job_id and status "submitted", poll GET
    /api/v2/bulk_jobs/{job_id} until status is complete, then fetch results. Large jobs
    can take up to 3 hours when many domains are new to the platform.
  submit: POST /api/v2/bulk_jobs
  poll: GET /api/v2/bulk_jobs/{job_id}
  list: GET /api/v2/bulk_jobs
  job_states:
  - submitted
  - processing
  - in-progress
  - ready
  - completed
  docs: https://kb.intricately.com/docs/create-a-bulk-job
