rate_limits:
- scope: global
  limit_count: 1
  interval: second
  description: >-
    The API permits one request per second. Exceeding it returns application error
    code 3000 ("You have exceeded the request limit of 1 req/sec.").
  breach_code: 3000
quotas:
- type: api-credits
  description: >-
    Usage is metered in API credits. Code 5001 signals insufficient credits for the
    requested job size; code 5006 signals no remaining credits. Credit allotment is
    set by the Enterprise plan.
  breach_codes:
  - 5001
  - 5006
